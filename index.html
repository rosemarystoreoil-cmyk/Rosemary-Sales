  <script>
    const buttons = document.querySelectorAll('.lang-btn');
    const translatable = document.querySelectorAll('[data-ar][data-he]');

    function setLanguage(lang) {
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'rtl';

      translatable.forEach(el => {
        el.textContent = el.dataset[lang];
      });

      buttons.forEach(btn => btn.classList.toggle('active', btn.dataset.lang === lang));
      localStorage.setItem('landingLanguage', lang);
    }

    buttons.forEach(btn => btn.addEventListener('click', () => setLanguage(btn.dataset.lang)));

    const saved = localStorage.getItem('landingLanguage');
    if (saved === 'he') setLanguage('he');

    // TikTok event: tracks WhatsApp button clicks.
    document.querySelectorAll('.wa-link').forEach(link => {
      link.addEventListener('click', () => {
        if (window.ttq && typeof ttq.track === 'function') {
          ttq.track('Contact', { channel: 'WhatsApp' });
        }
      });
    });
